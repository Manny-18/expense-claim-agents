<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6472"/>
    </marker>
    <marker id="arrowlight" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#ffffff"/>
  <text x="28" y="40" font-size="21" font-weight="700" fill="#1b2430">Expense Claim Adjudication Crew</text>
  <text x="28" y="62" font-size="13" fill="#5a6472">Six domain expert agents over a deterministic tool layer. The agents reason; the tools decide the money.</text>

  <!-- input -->
  <rect x="28" y="92" width="170" height="92" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="42" y="114" font-size="12" font-weight="700" fill="#1b2430">INPUT</text>
  <text x="42" y="134" font-size="11" fill="#39424f">Claim and line items</text>
  <text x="42" y="151" font-size="11" fill="#39424f">Employee master (grade)</text>
  <text x="42" y="168" font-size="11" fill="#39424f">Claim history</text>

  <!-- knowledge -->
  <rect x="28" y="206" width="170" height="104" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="42" y="228" font-size="12" font-weight="700" fill="#1b2430">KNOWLEDGE</text>
  <text x="42" y="248" font-size="11" fill="#39424f">T&amp;E policy v3.2</text>
  <text x="42" y="265" font-size="11" fill="#39424f">47 clauses, chunked</text>
  <text x="42" y="282" font-size="11" fill="#39424f">by clause id</text>
  <text x="42" y="299" font-size="11" fill="#39424f">TF-IDF retrieval</text>

  <!-- pipeline box -->
  <rect x="236" y="92" width="480" height="420" rx="10" fill="#fbfcfd" stroke="#c3ccd8" stroke-dasharray="4 3"/>
  <text x="252" y="114" font-size="12" font-weight="700" fill="#5a6472">BLACKBOARD PIPELINE</text>
  <text x="252" y="131" font-size="10.5" fill="#8a94a2">agents never call each other; they read and write one shared state object</text>

  <!-- intake -->
  <rect x="258" y="146" width="436" height="48" rx="7" fill="#e8f0fb" stroke="#8fb0e0"/>
  <text x="274" y="168" font-size="13" font-weight="700" fill="#1b3a66">1. Intake Agent</text>
  <text x="274" y="185" font-size="11" fill="#395574">Document and Data Steward  ·  evidence sufficiency, TE-05</text>
  <text x="660" y="176" font-size="10" fill="#6b7d94" text-anchor="end">can disallow</text>

  <!-- short circuit, routed inside the pipeline so it collides with nothing -->
  <path d="M258 182 Q 246 182 246 200 L 246 400 Q 246 414 254 414" fill="none" stroke="#9aa4b2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowlight)"/>
  <text x="243" y="306" font-size="9.5" fill="#8a94a2" text-anchor="middle" transform="rotate(-90 243 306)">short circuit: no line has any evidence</text>

  <!-- three experts -->
  <rect x="258" y="216" width="436" height="150" rx="7" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="274" y="236" font-size="11" font-weight="700" fill="#5a6472">2. THREE SPECIALISTS, ONE SHARED BLACKBOARD</text>

  <rect x="272" y="246" width="408" height="34" rx="6" fill="#eaf6ef" stroke="#8fc6a6"/>
  <text x="286" y="262" font-size="12" font-weight="700" fill="#17502f">Policy Entitlement Expert</text>
  <text x="286" y="275" font-size="10.5" fill="#3b6b51">ceilings, grades, conveyance, timelines  ·  TE-02/03/04/07/10  ·  can disallow with a clause</text>

  <rect x="272" y="286" width="408" height="34" rx="6" fill="#fdf3e3" stroke="#dcb579"/>
  <text x="286" y="302" font-size="12" font-weight="700" fill="#6b4a0d">Indirect Tax and Input Credit Expert</text>
  <text x="286" y="315" font-size="10.5" fill="#7d5f26">GSTIN checksum, section 17(5) blocked credit  ·  TE-06  ·  advises, rarely disallows</text>

  <rect x="272" y="326" width="408" height="34" rx="6" fill="#fbecec" stroke="#dc9a9a"/>
  <text x="286" y="342" font-size="12" font-weight="700" fill="#7a1f1f">Integrity and Duplicate Risk Analyst</text>
  <text x="286" y="355" font-size="10.5" fill="#8c3a3a">duplicates, splits, leave dates  ·  TE-09  ·  may escalate only, may never reject</text>

  <!-- adjudicator -->
  <rect x="258" y="388" width="436" height="56" rx="7" fill="#e8f0fb" stroke="#8fb0e0"/>
  <text x="274" y="408" font-size="13" font-weight="700" fill="#1b3a66">3. Adjudicator</text>
  <text x="274" y="424" font-size="10.5" fill="#395574">precedence: escalation &gt; uncited disallowance &gt; reject &gt; partial &gt; approve</text>
  <text x="274" y="438" font-size="10.5" fill="#395574">the only agent that sets an outcome; routes to the approver under TE-08.1</text>

  <!-- communicator -->
  <rect x="258" y="456" width="436" height="42" rx="7" fill="#e8f0fb" stroke="#8fb0e0"/>
  <text x="274" y="474" font-size="13" font-weight="700" fill="#1b3a66">4. Communicator</text>
  <text x="274" y="489" font-size="10.5" fill="#395574">employee message and audit note; cannot change the outcome</text>

  <!-- tool layer -->
  <rect x="28" y="332" width="170" height="180" rx="8" fill="#f3eefa" stroke="#b9a6d8"/>
  <text x="42" y="354" font-size="12" font-weight="700" fill="#3d2566">TOOL LAYER</text>
  <text x="42" y="371" font-size="10" fill="#5b4383">deterministic, unit tested</text>
  <text x="42" y="392" font-size="10.5" fill="#39424f">GSTIN checksum</text>
  <text x="42" y="409" font-size="10.5" fill="#39424f">ceiling arithmetic</text>
  <text x="42" y="426" font-size="10.5" fill="#39424f">date and age maths</text>
  <text x="42" y="443" font-size="10.5" fill="#39424f">mileage rates</text>
  <text x="42" y="460" font-size="10.5" fill="#39424f">duplicate matching</text>
  <text x="42" y="477" font-size="10.5" fill="#39424f">approval routing</text>
  <text x="42" y="497" font-size="10" font-style="italic" fill="#5b4383">no agent does arithmetic</text>

  <!-- outputs -->
  <rect x="762" y="146" width="190" height="78" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="776" y="168" font-size="12" font-weight="700" fill="#1b2430">DECISION</text>
  <text x="776" y="187" font-size="10.5" fill="#39424f">APPROVE / PARTIAL /</text>
  <text x="776" y="203" font-size="10.5" fill="#39424f">REJECT / ESCALATE</text>
  <text x="776" y="218" font-size="10.5" fill="#39424f">payable amount, risk score</text>

  <rect x="762" y="240" width="190" height="66" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="776" y="262" font-size="12" font-weight="700" fill="#1b2430">AUDIT TRAIL</text>
  <text x="776" y="281" font-size="10.5" fill="#39424f">every finding, its clause,</text>
  <text x="776" y="296" font-size="10.5" fill="#39424f">its agent and its timing</text>

  <rect x="762" y="322" width="190" height="66" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="776" y="344" font-size="12" font-weight="700" fill="#1b2430">EMPLOYEE MESSAGE</text>
  <text x="776" y="363" font-size="10.5" fill="#39424f">plain, specific, never</text>
  <text x="776" y="378" font-size="10.5" fill="#39424f">accusatory</text>

  <rect x="762" y="404" width="190" height="94" rx="8" fill="#eaf6ef" stroke="#8fc6a6"/>
  <text x="776" y="426" font-size="12" font-weight="700" fill="#17502f">HUMAN REVIEWER</text>
  <text x="776" y="445" font-size="10.5" fill="#3b6b51">sees the queue sorted by</text>
  <text x="776" y="460" font-size="10.5" fill="#3b6b51">risk, can override any</text>
  <text x="776" y="475" font-size="10.5" fill="#3b6b51">decision with a reason</text>
  <text x="776" y="491" font-size="10.5" font-weight="700" fill="#17502f">the human decides</text>

  <!-- arrows -->
  <line x1="198" y1="138" x2="252" y2="160" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="198" y1="258" x2="252" y2="268" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="198" y1="420" x2="252" y2="300" stroke="#b9a6d8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="194" x2="476" y2="212" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="366" x2="476" y2="384" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="444" x2="476" y2="452" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="694" y1="416" x2="756" y2="190" stroke="#5a6472" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="694" y1="420" x2="756" y2="272" stroke="#5a6472" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="694" y1="477" x2="756" y2="354" stroke="#5a6472" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="694" y1="490" x2="756" y2="450" stroke="#5a6472" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- footer note -->
  <rect x="28" y="534" width="924" height="98" rx="8" fill="#fbfcfd" stroke="#c3ccd8"/>
  <text x="44" y="556" font-size="12" font-weight="700" fill="#1b2430">The three design decisions that matter</text>
  <text x="44" y="577" font-size="11" fill="#39424f">1.  No agent computes a rupee value. Arithmetic lives in a unit tested tool layer, so the money is auditable and the model is not load bearing.</text>
  <text x="44" y="596" font-size="11" fill="#39424f">2.  Escalation outranks rejection. An ambiguous claim reaches a person; a machine never concludes that an employee was dishonest.</text>
  <text x="44" y="615" font-size="11" fill="#39424f">3.  The system runs with no model at all. Offline is the default, so every decision is reproducible and the evaluation means something.</text>
</svg>
